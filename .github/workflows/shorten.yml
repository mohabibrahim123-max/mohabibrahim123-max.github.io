name: Create branded short links

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/shorten.yml"

permissions:
  contents: write

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create short links
        shell: bash
        run: |
          set -euo pipefail
          shorten() {
            curl -fsSG "https://is.gd/create.php"               --data-urlencode "format=simple"               --data-urlencode "url=$1"
          }
          HOME_LINK="$(shorten 'https://mohabibrahim123-max.github.io/')"
          STUDENTS_LINK="$(shorten 'https://mohabibrahim123-max.github.io/students/')"
          TEACHERS_LINK="$(shorten 'https://mohabibrahim123-max.github.io/teachers/')"
          TAHSILI_LINK="$(shorten 'https://mohabibrahim123-max.github.io/tahsili/')"
          QUDRAT_LINK="$(shorten 'https://mohabibrahim123-max.github.io/qudrat/')"
          {
            echo "general=$HOME_LINK"
            echo "students=$STUDENTS_LINK"
            echo "teachers=$TEACHERS_LINK"
            echo "tahsili=$TAHSILI_LINK"
            echo "qudrat=$QUDRAT_LINK"
          } > shortlinks.txt
      - name: Save short links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shortlinks.txt
          git diff --cached --quiet && exit 0
          git commit -m "Generate public short links"
          git push
